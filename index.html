<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MVP - Controle Financeiro Pessoal</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --primary: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --font-size: 16px;
    }

    body.high-contrast {
      --bg: #000000;
      --card: #111111;
      --text: #ffff00;
      --border: #ffff00;
      --primary: #00ffff;
      --green: #00ff00;
      --red: #ff4d4d;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: var(--font-size);
      margin: 0;
      padding: 20px;
      transition: all 0.2s ease;
    }

    .container { max-width: 850px; margin: 0 auto; }

    .a11y-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 16px;
    }

    .a11y-btn {
      background: var(--card);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9em;
    }

    header h1 { margin: 0 0 6px 0; font-size: 1.6em; }
    header p { margin: 0 0 20px 0; opacity: 0.85; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .card h3 { margin: 0 0 8px 0; font-size: 0.95em; }
    .card .valor { font-size: 1.4em; font-weight: bold; }
    .receita { color: var(--green); }
    .despesa { color: var(--red); }

    .form-box, .list-box {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.9em; }

    input, select {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 1em;
      box-sizing: border-box;
    }

    .btn-add {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
    }

    body.high-contrast .btn-add { color: #000000; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 12px 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="a11y-bar" aria-label="Barra de Acessibilidade">
      <button class="a11y-btn" onclick="toggleContrast()" aria-pressed="false" id="btnContrast">
        ◐ Alto Contraste
      </button>
      <button class="a11y-btn" onclick="changeFont(2)">A+ Aumentar Fonte</button>
      <button class="a11y-btn" onclick="changeFont(-2)">A- Diminuir Fonte</button>
    </nav>

    <header>
      <h1>Controle Financeiro Pessoal (MVP)</h1>
      <p>Gestão simplificada de receitas, despesas e educação financeira acessível</p>
    </header>

    <section class="cards" aria-label="Resumo Financeiro">
      <div class="card">
        <h3>Total de Receitas</h3>
        <div class="valor receita" id="totalReceitas">R$ 0,00</div>
      </div>
      <div class="card">
        <h3>Total de Despesas</h3>
        <div class="valor despesa" id="totalDespesas">R$ 0,00</div>
      </div>
      <div class="card">
        <h3>Saldo Atual</h3>
        <div class="valor" id="saldoAtual">R$ 0,00</div>
      </div>
    </section>

    <section class="form-box" aria-label="Nova Movimentação">
      <div class="form-row">
        <div>
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Salário, Mercado, Aluguel..." />
        </div>
        <div>
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" step="0.01" placeholder="0,00" />
        </div>
        <div>
          <label for="tipo">Tipo</label>
          <select id="tipo">
            <option value="RECEITA">Receita (+)</option>
            <option value="DESPESA">Despesa (-)</option>
          </select>
        </div>
        <button class="btn-add" onclick="adicionar()">Adicionar</button>
      </div>
    </section>

    <section class="list-box" aria-label="Histórico de Transações">
      <h2 style="margin-top:0; font-size:1.2em;">Histórico de Movimentações</h2>
      <table>
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Tipo</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo"></tbody>
      </table>
    </section>
  </div>

  <script>
    const transacoes = [
      { descricao: "Salário Mensal", tipo: "RECEITA", valor: 3500.00 },
      { descricao: "Aluguel Residencial", tipo: "DESPESA", valor: 1200.00 }
    ];
    let currentFont = 16;

    function formatarMoeda(v) {
      return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    function atualizarTela() {
      const tbody = document.getElementById("tabelaCorpo");
      tbody.innerHTML = "";
      let rec = 0, desp = 0;

      transacoes.forEach(t => {
        if (t.tipo === "RECEITA") rec += t.valor;
        else desp += t.valor;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${t.descricao}</td>
          <td class="${t.tipo === 'RECEITA' ? 'receita' : 'despesa'}"><strong>${t.tipo}</strong></td>
          <td>${formatarMoeda(t.valor)}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("totalReceitas").innerText = formatarMoeda(rec);
      document.getElementById("totalDespesas").innerText = formatarMoeda(desp);
      document.getElementById("saldoAtual").innerText = formatarMoeda(rec - desp);
    }

    function adicionar() {
      const desc = document.getElementById("descricao").value.trim();
      const val = parseFloat(document.getElementById("valor").value);
      const tipo = document.getElementById("tipo").value;

      if (desc.length < 3 || isNaN(val) || val <= 0) {
        alert("Preencha uma descrição válida (mín. 3 letras) e valor maior que zero.");
        return;
      }

      transacoes.push({ descricao: desc, tipo, valor: val });
      document.getElementById("descricao").value = "";
      document.getElementById("valor").value = "";
      atualizarTela();
    }

    function toggleContrast() {
      document.body.classList.toggle("high-contrast");
    }

    function changeFont(delta) {
      currentFont = Math.min(24, Math.max(14, currentFont + delta));
      document.documentElement.style.setProperty("--font-size", currentFont + "px");
    }

    atualizarTela();
  </script>
</body>
</html>
